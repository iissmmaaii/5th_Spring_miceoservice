server.port=8087
spring.application.name=file-service

# ===============================
# Database - MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/cyphervault_file_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JWT
# Same as iam-service and api-gateway
# ===============================
security.jwt.secret=CypherVaultIamServiceJwtSecretKeyMustBeLongEnoughForHs256Algorithm123456

# ===============================
# File Storage
# ===============================
file-storage.root-dir=uploads/file-service
file-storage.public-download-base-url=/api/files
file-storage.allowed-content-types=image/png,image/jpeg,image/webp,application/pdf

# ===============================
# Multipart Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api/files/v3/api-docs
springdoc.swagger-ui.persistAuthorization=true

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.cyphervault.file_service=DEBUG
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.client-id=file-service-producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topics.user-verification-status-changed=file.user-verification-status-changed.v1