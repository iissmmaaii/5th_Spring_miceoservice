server.port=8085
spring.application.name=fabric-orchestrator-service

# ===============================
# Kafka Consumer
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=fabric-orchestrator-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.ack-mode=manual

app.kafka.topics.user-public-key-registered=iam.user-public-key.registered.v1

# ===============================
# Fabric Network
# ===============================
fabric.channel-name=cyphervaultchannel
fabric.identity-chaincode-name=identity-registry-java

fabric.msp-id=Org1MSP

fabric.peer-endpoint=192.168.146.128:7051
fabric.override-authority=peer0.org1.example.com

fabric.endorsing-orgs=Org1MSP,Org2MSP

# ===============================
# Fabric Crypto Material - Org1 User1
# ===============================
fabric.tls-cert-path=C:/Users/Lenovo/IdeaProjects/5th_Spring_miceoservice/infra/fabric/crypto/org1/peer0-org1-tls-ca.crt
fabric.cert-path=C:/Users/Lenovo/IdeaProjects/5th_Spring_miceoservice/infra/fabric/crypto/org1/user1-msp/signcerts/cert.pem
fabric.private-key-dir=C:/Users/Lenovo/IdeaProjects/5th_Spring_miceoservice/infra/fabric/crypto/org1/user1-msp/keystore

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.cyphervault.fabric=DEBUG

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info