server.port=8080
spring.application.name=api-gateway

# ===============================
# JWT
# Must be same as iam-service
# ===============================
security.jwt.secret=CypherVaultIamServiceJwtSecretKeyMustBeLongEnoughForHs256Algorithm123456

# ===============================
# CORS - Browser frontends only
# ===============================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# ===============================
# Simple Service Instances for Load Balancing
# ===============================

# IAM service instances
spring.cloud.discovery.client.simple.instances.iam-service[0].uri=http://localhost:8081
# spring.cloud.discovery.client.simple.instances.iam-service[1].uri=http://localhost:8181

# Account service instances
spring.cloud.discovery.client.simple.instances.account-service[0].uri=http://localhost:8086
# spring.cloud.discovery.client.simple.instances.account-service[1].uri=http://localhost:8186

# IMPORTANT:
# Do NOT add fabric-orchestrator-service here.
# fabric-orchestrator-service must remain internal only.

# ===============================
# Circuit Breaker - IAM
# ===============================
resilience4j.circuitbreaker.instances.iamCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.iamCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.iamCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.iamCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.iamCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.iamCircuitBreaker.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.iamCircuitBreaker.slow-call-rate-threshold=50

resilience4j.timelimiter.instances.iamCircuitBreaker.timeout-duration=5s

# ===============================
# Circuit Breaker - Account
# ===============================
resilience4j.circuitbreaker.instances.accountCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accountCircuitBreaker.slow-call-duration-threshold=8s
resilience4j.circuitbreaker.instances.accountCircuitBreaker.slow-call-rate-threshold=50

resilience4j.timelimiter.instances.accountCircuitBreaker.timeout-duration=10s

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.cyphervault.api_gateway=DEBUG
# ===============================
# Swagger UI Aggregation
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persistAuthorization=true

springdoc.swagger-ui.urls[0].name=IAM Service
springdoc.swagger-ui.urls[0].url=/api/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=Account Service
springdoc.swagger-ui.urls[1].url=/api/accounts/v3/api-docs
# ===============================
# File Service Instance
# ===============================
spring.cloud.discovery.client.simple.instances.file-service[0].uri=http://localhost:8087

# ===============================
# Swagger UI Aggregation
# ===============================
springdoc.swagger-ui.urls[2].name=File Service
springdoc.swagger-ui.urls[2].url=/api/files/v3/api-docs