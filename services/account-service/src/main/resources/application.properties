server.port=8086
spring.application.name=account-service

fabric-orchestrator.base-url=http://localhost:8085

# ===============================
# PostgreSQL - Local Installed PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/cyphervault_account_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# Kafka Consumer
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=account-service-user-verification-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.listener.ack-mode=record

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.cyphervault.account_service.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.cyphervault.account_service.verification.dto.UserVerificationStatusChangedEvent

# Topic consumed from file-service
app.kafka.topics.user-verification-status-changed=file.user-verification-status-changed.v1

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# Swagger
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api/accounts/v3/api-docs
springdoc.swagger-ui.persistAuthorization=true

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.cyphervault.account_service=DEBUG

# ===============================
# Resilience4j Circuit Breaker
# ===============================
resilience4j.circuitbreaker.instances.fabricOrchestrator.sliding-window-size=10
resilience4j.circuitbreaker.instances.fabricOrchestrator.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.fabricOrchestrator.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fabricOrchestrator.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fabricOrchestrator.permitted-number-of-calls-in-half-open-state=3

resilience4j.timelimiter.instances.fabricOrchestrator.timeout-duration=10s