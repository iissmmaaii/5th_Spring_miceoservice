server.port=8086
spring.application.name=account-service

fabric-orchestrator.base-url=http://localhost:8085

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.com.cyphervault.account_service=DEBUG

# ===============================
# Resilience4j Circuit Breaker
# ===============================
resilience4j.circuitbreaker.instances.fabricOrchestrator.sliding-window-size=10
resilience4j.circuitbreaker.instances.fabricOrchestrator.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.fabricOrchestrator.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fabricOrchestrator.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fabricOrchestrator.permitted-number-of-calls-in-half-open-state=3

resilience4j.timelimiter.instances.fabricOrchestrator.timeout-duration=10s